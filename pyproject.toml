[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rocky-agent"
dynamic = ["version"]
description = "Rocky — a durable, goal-driven autonomous digital agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "temporalio>=1.10,<2", "openai>=2,<3", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1",
  # Headless pages for the browse tool; it drives the installed Chrome.
  "playwright>=1.49,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1",
  # starlette.testclient runs on httpx2; Rocky itself keeps using httpx.
  "httpx2>=2.16,<3",
]

[project.scripts]
rocky = "rocky.cli:main"

[tool.hatch.version]
path = "src/rocky/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rocky"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: starts an actual Temporal test service"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
